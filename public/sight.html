<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>景点搜索 · 订懂机旅行规划</title>
  <meta name="description" content="输入城市，一键获取该城市最值得游览的景点，按热门程度与评分综合排序">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f91'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E订%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-sight">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">订</span>
        <span class="brand-name">订懂机<i>旅行规划</i></span>
      </a>
      <nav class="module-nav" aria-label="功能模块">
        <a href="/ticket.html">车票</a>
        <a href="/hotel.html">酒店</a>
        <a href="/sight.html" class="is-active">景点</a>
        <a href="/food.html">美食</a>
        <a href="/settings.html" class="nav-settings">设置</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero hero-scene hero-sight">
      <span class="hero-kicker">WANDER / 去看一座城</span>
      <h1>去看一座城，从值得的地方开始</h1>
      <p>联网搜索城市景点，按热门程度与评分综合排序，门票、开放时间一目了然</p>
      <span class="hero-stamp" aria-hidden="true">走出去<br><b>遇见风景</b></span>
    </section>

    <section class="search-card search-card-sight" aria-label="景点查询">
      <form id="sight-form" autocomplete="off" novalidate>
        <div class="field field-city">
          <label for="city-input">目的地城市</label>
          <input id="city-input" list="city-list" placeholder="如：成都" maxlength="12" required>
        </div>
        <div class="field field-source">
          <label for="source-select">数据来源</label>
          <select id="source-select">
            <option value="local">本地数据（秒开）</option>
            <option value="llm">AI 联网搜索（较慢）</option>
          </select>
        </div>
        <button type="submit" class="search-btn" id="search-btn">搜索</button>
      </form>
      <datalist id="city-list"></datalist>
      <p id="source-hint" class="source-hint" hidden>
        AI 联网搜索需实时生成内容，约需 10~40 秒，请耐心等待；如需秒开结果，可选择「本地数据」。
      </p>
    </section>
    <div class="quick-chips" aria-label="热门城市">
      <span class="chips-label">热门城市</span>
      <button type="button" class="chip" data-city="成都">成都</button>
      <button type="button" class="chip" data-city="北京">北京</button>
      <button type="button" class="chip" data-city="上海">上海</button>
      <button type="button" class="chip" data-city="杭州">杭州</button>
      <button type="button" class="chip" data-city="西安">西安</button>
      <button type="button" class="chip" data-city="广州">广州</button>
    </div>



    <section id="result-section" class="result-section" hidden>
      <div class="result-toolbar">
        <div class="sight-summary" id="sight-summary"></div>
        <div class="sort">
          <label for="sort-select">排序</label>
          <select id="sort-select">
            <option value="score">综合推荐</option>
            <option value="rating">评分最高</option>
            <option value="popularity">热度优先</option>
            <option value="free">免费优先</option>
          </select>
        </div>
      </div>
      <div id="sight-list" class="list sight-list"></div>
    </section>

    <div class="page-ambient ambient-sight" aria-hidden="true">
      <span class="ambient-sun"></span><span class="ambient-hill hill-one"></span><span class="ambient-hill hill-two"></span>
      <span class="ambient-cityline"></span>
      <span class="ambient-caption">风景还在更远处</span>
    </div>
  </main>

  <footer class="footer">
    <div class="container">景点信息仅供参考，出行前请以景区官方公告为准 · 订懂机旅行规划</div>
  </footer>

  <div id="map-modal" class="map-modal" hidden role="dialog" aria-modal="true" aria-labelledby="map-modal-name">
    <div class="map-modal-mask" id="map-modal-mask"></div>
    <div class="map-modal-body">
      <div class="map-modal-header">
        <div class="map-modal-title">
          <b id="map-modal-name"></b>
          <span id="map-modal-addr"></span>
        </div>
        <div class="map-modal-actions">
          <a id="map-modal-open" class="map-open-link" target="_blank" rel="noopener">在高德地图中打开</a>
          <button type="button" class="map-close-btn" id="map-modal-close" aria-label="关闭地图">×</button>
        </div>
      </div>
      <iframe id="map-frame" class="map-frame" title="景点位置地图" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/llm-progress.js"></script>
  <script src="/js/sight.js"></script>
</body>
</html>
