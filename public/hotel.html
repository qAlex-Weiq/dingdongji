<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒店搜索 · 订懂机旅行规划</title>
  <meta name="description" content="输入城市，选择价格档位与位置偏好，一键获取该城市酒店，按热度与评分综合排序">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f91'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E订%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-hotel">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">订</span>
        <span class="brand-name">订懂机<i>旅行规划</i></span>
      </a>
      <nav class="module-nav" aria-label="功能模块">
        <a href="/ticket.html">车票</a>
        <a href="/hotel.html" class="is-active">酒店</a>
        <a href="/sight.html">景点</a>
        <a href="/food.html">美食</a>
        <a href="/plan.html">行程规划</a>
        <a href="/settings.html" class="nav-settings">设置</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero hero-scene hero-hotel">
      <span class="hero-kicker">STAY / 住得好，旅程才完整</span>
      <h1>为今晚，挑一处安心落脚</h1>
      <p>选价格档位、挑位置偏好，联网搜索城市酒店，按热度与评分综合排序</p>
      <span class="hero-stamp" aria-hidden="true">慢下来<br><b>好好住</b></span>
    </section>

    <section class="search-card search-card-hotel" aria-label="酒店查询">
      <form id="hotel-form" autocomplete="off" novalidate>
        <div class="field field-city">
          <label for="city-input">目的地城市</label>
          <input id="city-input" list="city-list" placeholder="如：成都" maxlength="12" required>
        </div>
        <div class="field field-source">
          <label for="source-select">数据来源</label>
          <select id="source-select">
            <option value="local" selected>本地数据（秒开）</option>
            <option value="llm">AI 联网搜索（较慢）</option>
          </select>
        </div>
        <button type="submit" class="search-btn" id="search-btn">搜索</button>

        <div class="chip-row" role="radiogroup" aria-label="价格档位">
          <span class="chip-row-label">价格档位</span>
          <label class="chip"><input type="radio" name="tier" value="any" checked><span>不限</span></label>
          <label class="chip"><input type="radio" name="tier" value="budget"><span>¥200以下</span></label>
          <label class="chip"><input type="radio" name="tier" value="comfort"><span>¥200 - ¥450</span></label>
          <label class="chip"><input type="radio" name="tier" value="upscale"><span>¥450 - ¥800</span></label>
          <label class="chip"><input type="radio" name="tier" value="luxury"><span>¥800以上</span></label>
        </div>

        <div class="chip-row" role="radiogroup" aria-label="位置偏好">
          <span class="chip-row-label">位置偏好</span>
          <label class="chip"><input type="radio" name="location" value="any" checked><span>不限</span></label>
          <label class="chip"><input type="radio" name="location" value="downtown"><span>市中心</span></label>
          <label class="chip"><input type="radio" name="location" value="station"><span>火车站周边</span></label>
          <label class="chip"><input type="radio" name="location" value="airport"><span>机场周边</span></label>
          <label class="chip"><input type="radio" name="location" value="scenic"><span>景点周边</span></label>
        </div>
      </form>
      <datalist id="city-list"></datalist>
      <p id="source-hint" class="source-hint" hidden>
        AI 联网搜索需实时生成内容，约需 10~40 秒，请耐心等待；如需秒开结果，可选择「本地数据」。
      </p>
    </section>
    <div class="quick-chips" aria-label="热门城市">
      <span class="chips-label">热门城市</span>
      <button type="button" class="chip" data-city="成都">成都</button>
      <button type="button" class="chip" data-city="北京">北京</button>
      <button type="button" class="chip" data-city="上海">上海</button>
      <button type="button" class="chip" data-city="杭州">杭州</button>
      <button type="button" class="chip" data-city="西安">西安</button>
      <button type="button" class="chip" data-city="广州">广州</button>
    </div>



    <section id="result-section" class="result-section" hidden>
      <div class="result-toolbar">
        <div class="sight-summary" id="hotel-summary"></div>
        <div class="sort">
          <label for="sort-select">排序</label>
          <select id="sort-select">
            <option value="score">综合推荐</option>
            <option value="rating">评分最高</option>
            <option value="popularity">热度优先</option>
            <option value="priceAsc">低价优先</option>
            <option value="priceDesc">高价优先</option>
          </select>
        </div>
      </div>
      <div id="hotel-list" class="list sight-list"></div>
    </section>

    <div class="page-ambient ambient-hotel" aria-hidden="true">
      <span class="ambient-building building-main"></span><span class="ambient-building building-side"></span>
      <span class="ambient-window window-a"></span><span class="ambient-window window-b"></span><span class="ambient-window window-c"></span>
      <span class="ambient-caption">给旅途留一盏灯</span>
    </div>
  </main>

  <footer class="footer">
    <div class="container">酒店价格与评分仅供参考，以预订平台实时信息为准 · 订懂机旅行规划</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/llm-progress.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/hotel.js"></script>
</body>
</html>
