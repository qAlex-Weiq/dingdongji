<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叮咚机 · 旅行规划</title>
  <meta name="description" content="车票、酒店、景点、美食四大模块，一站式制订旅行计划">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f91'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E叮%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-home">
  <header class="topbar topbar--glass">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">叮</span>
        <span class="brand-name">叮咚机<i>旅行规划</i></span>
      </a>
      <nav class="module-nav" aria-label="功能模块">
        <a href="/ticket.html">车票</a>
        <a href="/hotel.html">酒店</a>
        <a href="/sight.html">景点</a>
        <a href="/food.html">美食</a>
        <a href="/settings.html" class="nav-settings">设置</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero hero-home">
      <div class="hero-slideshow" aria-hidden="true">
        <div class="hero-slide">
          <img src="/images/great-wall.jpg" alt="万里长城"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/forbidden-city.jpg" alt="故宫角楼/紫禁城"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/shanghai-skyline.jpg" alt="上海陆家嘴三件套"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1538428494232-9d0d8a3ab40d?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-4.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-5.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-6.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-7.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-8.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-9.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-10.jpg" alt="中国地标风光">
        </div>
      </div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <h1>一站式旅行规划</h1>
        <p>车票 · 酒店 · 景点 · 美食，四个模块帮你安排整段旅程</p>
      </div>
    </section>

    <section class="module-grid" aria-label="选择功能模块">
      <a class="module-card" href="/ticket.html">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 11v2"/><path d="M13 17v2"/></svg>
        </span>
        <span class="module-info">
          <span class="module-name">车票</span>
          <span class="module-desc">机票与火车票查询、比价、时刻一览</span>
        </span>
        <span class="module-status st-live">可用</span>
      </a>

      <a class="module-card" href="/hotel.html">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        </span>
        <span class="module-info">
          <span class="module-name">酒店</span>
          <span class="module-desc">按城市与偏好查询酒店，热度评分综合排行</span>
        </span>
        <span class="module-status st-live">可用</span>
      </a>

      <a class="module-card" href="/sight.html">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
        <span class="module-info">
          <span class="module-name">景点</span>
          <span class="module-desc">城市景点搜索，热度评分综合排行</span>
        </span>
        <span class="module-status st-live">可用</span>
      </a>

      <a class="module-card" href="/food.html">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
        </span>
        <span class="module-info">
          <span class="module-name">美食</span>
          <span class="module-desc">特色菜品 / 餐厅筛选 / 个性化推荐</span>
        </span>
        <span class="module-status st-live">可用</span>
      </a>
    </section>
  </main>

  <footer class="footer">
    <div class="container">四大模块逐步完善中 · 叮咚机旅行规划</div>
  </footer>
</body>
</html>
