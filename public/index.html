<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订懂机 · 旅行规划</title>
  <meta name="description" content="车票、酒店、景点、美食四大模块，一站式制订旅行计划">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f91'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E订%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-home">
  <header class="topbar topbar--glass">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">订</span>
        <span class="brand-name">订懂机<i>旅行规划</i></span>
      </a>
      <nav class="module-nav" aria-label="功能模块">
        <a href="/ticket.html">车票</a>
        <a href="/hotel.html">酒店</a>
        <a href="/sight.html">景点</a>
        <a href="/food.html">美食</a>
        <a href="/plan.html">行程规划</a>
        <a href="/settings.html" class="nav-settings">设置</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero hero-home">
      <div class="hero-slideshow" aria-hidden="true">
        <div class="hero-slide">
          <img src="/images/great-wall.jpg" alt="万里长城"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/forbidden-city.jpg" alt="故宫角楼/紫禁城"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1547981609-4b6bfe67ca0b?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/shanghai-skyline.jpg" alt="上海陆家嘴三件套"
               onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1538428494232-9d0d8a3ab40d?auto=format&fit=crop&w=1920&q=80'">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-4.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-5.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-6.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-7.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-8.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-9.jpg" alt="中国地标风光">
        </div>
        <div class="hero-slide">
          <img src="/images/landmark-10.jpg" alt="中国地标风光">
        </div>
      </div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <span class="home-kicker">DING DONG JOURNEY / 旅行从想法开始</span>
        <h1>把远方，写进下一段日子</h1>
        <p>先定目的地，再安排出行、住宿、路线和一顿值得记住的饭。</p>
        <a class="home-start" href="/plan.html">开始规划 <span aria-hidden="true">✦</span></a>
      </div>
    </section>

    <section class="journey-gallery" aria-label="旅行灵感入口">
      <div class="flow-heading">
        <span>TRAVEL NOTES / 旅行灵感</span>
        <p>先选一个让你心动的方向</p>
      </div>

      <div class="gallery-grid">
        <a class="gallery-card gallery-destination" href="/sight.html">
          <span class="gallery-label">DESTINATION</span>
          <strong>去看一座城</strong>
          <span>从值得的地方开始认识它</span>
        </a>
        <a class="gallery-card gallery-ticket" href="/ticket.html">
          <span class="gallery-label">GETTING THERE</span>
          <strong>把出发交给路线</strong>
          <span>航班与火车，慢慢挑一个合适的答案</span>
        </a>
        <a class="gallery-card gallery-stay" href="/hotel.html">
          <span class="gallery-label">STAY</span>
          <strong>今晚住得安心</strong>
        </a>
        <a class="gallery-card gallery-food" href="/food.html">
          <span class="gallery-label">TASTE</span>
          <strong>用一顿饭记住这座城</strong>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">四大模块逐步完善中 · 订懂机旅行规划</div>
  </footer>
</body>
</html>
